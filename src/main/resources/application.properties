spring.application.name=backendpetsalud
spring.datasource.url=jdbc:mysql://localhost:3306/petsalud_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=admin
spring.datasource.password=123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

server.port=8888

# ===== LDAP Embebido =====
spring.ldap.embedded.ldif=classpath:users.ldif
spring.ldap.embedded.base-dn=dc=petsalud,dc=cl
spring.ldap.embedded.port=8389
spring.ldap.urls=ldap://localhost:8389
spring.ldap.base=dc=petsalud,dc=cl
spring.ldap.username=uid=admin,ou=people,dc=petsalud,dc=cl
spring.ldap.password=admin123